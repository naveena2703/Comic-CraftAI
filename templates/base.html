<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        {{ app_name }}
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="site-header">

    <a
        href="/"
        class="brand"
    >
        ComicCraft
    </a>

    <span class="tagline">
        AI Comic Story Creator
    </span>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    ComicCraft • FastAPI • Gemini • AI Images • PDF

</footer>


<script
    src="/static/js/app.js"
></script>

</body>

</html>
